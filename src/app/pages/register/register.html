<div class="register-container">
  <h2>Register</h2>

  <form (ngSubmit)="onRegister()" #regForm="ngForm">

    <input
      type="text"
      placeholder="Name"
      [(ngModel)]="user.name"
      name="name"
      required
    />

    <input
      type="email"
      placeholder="Email"
      [(ngModel)]="user.email"
      name="email"
      required
    />

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="user.password"
      name="password"
      required
    />

    <button type="submit">Register</button>
  </form>

  <p>{{ message }}</p>

  <p><a routerLink="/">Back to Login</a></p>
</div>
